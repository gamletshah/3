<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Панель администратора</h1>
        
        <section class="product-form">
            <h2>Добавить товар</h2>
            <form id="addProductForm">
                <input type="text" id="productName" placeholder="Название" required>
                <input type="number" id="productPrice" placeholder="Цена" required>
                <textarea id="productDescription" placeholder="Описание" required></textarea>
                <input type="text" id="productCategories" placeholder="Категории (через запятую)" required>
                <button type="submit">Добавить</button>
            </form>
        </section>
        
        <section class="product-list">
            <h2>Список товаров</h2>
            <table id="productsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Цена</th>
                        <th>Описание</th>
                        <th>Категории</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>

    <script src="admin.js"></script>
</body>
</html>
